<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AIReply Settings</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #18212f; background: #fbfcfe; }
      * { box-sizing: border-box; }
      body { max-width: 620px; margin: 0 auto; padding: 30px 20px 48px; background: #fbfcfe; }
      header { display: flex; align-items: center; gap: 11px; padding-bottom: 24px; border-bottom: 1px solid #e8ecf3; }
      header img { width: 32px; height: 32px; }
      h1 { margin: 0; font-size: 21px; letter-spacing: -.03em; }
      header p { margin: 4px 0 0; color: #758197; font-size: 12px; }
      section { padding-top: 26px; }
      h2 { margin: 0; font-size: 16px; letter-spacing: -.02em; }
      .intro { margin: 7px 0 22px; color: #637086; font-size: 13px; line-height: 1.5; }
      .field { margin-top: 17px; }
      label { display: block; margin-bottom: 7px; color: #3b475b; font-size: 12px; font-weight: 700; }
      input, textarea { width: 100%; padding: 11px 12px; border: 1px solid #d7dfe9; border-radius: 9px; outline: none; background: #fff; color: #18212f; font: inherit; font-size: 13px; }
      input:focus, textarea:focus { border-color: #315efb; box-shadow: 0 0 0 3px #e7ecff; }
      textarea { min-height: 86px; resize: vertical; }
      .hint { margin: 7px 0 0; color: #758197; font-size: 11px; line-height: 1.45; }
      .row { display: flex; align-items: center; gap: 12px; margin-top: 24px; }
      button { padding: 11px 17px; border: 0; border-radius: 9px; background: #315efb; color: #fff; cursor: pointer; font: inherit; font-size: 13px; font-weight: 700; }
      button:hover { background: #244ddd; }
      button:focus-visible { outline: 3px solid #cbd7ff; outline-offset: 2px; }
      #status { min-height: 17px; color: #137653; font-size: 12px; }
      #status.error { color: #c24151; }
    </style>
  </head>
  <body>
    <header><img src="/icons/icon.svg" alt="AIReply logo" /><div><h1>AIReply</h1><p>Provider and reply preferences</p></div></header>
    <section>
      <h2>Custom provider</h2>
      <p class="intro">Configure your own OpenAI-compatible provider. Values stay in this browser and are only used when System AI is disabled.</p>
      <div class="field"><label for="apiKey">API key</label><input id="apiKey" type="password" autocomplete="off" placeholder="Paste your provider key" /></div>
      <div class="field"><label for="baseUrl">API base URL</label><input id="baseUrl" type="url" placeholder="https://api.openai.com/v1" /><p class="hint">Examples: OpenRouter, OpenAI, Groq, or another OpenAI-compatible endpoint.</p></div>
      <div class="field"><label for="model">Model</label><input id="model" type="text" placeholder="gpt-4o-mini" /></div>
      <div class="field"><label for="persona">Persona / tone (optional)</label><textarea id="persona" placeholder="Warm, casual, concise — the way I talk to friends."></textarea></div>
      <div class="row"><button id="save">Save changes</button><span id="status" role="status"></span></div>
    </section>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
